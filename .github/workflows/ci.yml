name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 托管 runner 的预装 SDK 未必包含 compileSdk 37，缺失时补装；
      # 已存在时 sdkmanager 会直接返回，不会拖慢构建
      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble demo
        run: ./gradlew :demo:assembleDebug --stacktrace

      # 顺带验证发布配置没有腐化（坐标、POM、sources jar 都在这一步产出）
      - name: Verify publication
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
